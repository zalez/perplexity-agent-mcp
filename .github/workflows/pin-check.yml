name: Pin check

# Dev-tool pins go stale silently. Dependabot watches GitHub Actions and
# nothing else, because there are no runtime dependencies to watch — so the
# hooks in .pre-commit-config.yaml and the tool versions in ci.yml only get
# updated when somebody happens to look. A stale security scanner reports
# clean, which is indistinguishable from a clean repo.
#
# This nags; it does not fix. It deliberately does NOT run
# `pre-commit autoupdate`: that resolves to the newest tag on each upstream's
# default branch rather than its newest release, and on this repo it proposed
# downgrading gitleaks v8.30.1 -> v8.30.0. See .github/scripts/check_pins.py.

on:
  schedule:
    # Mondays, 06:00 UTC. Weekly is enough for a drift measured in weeks.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: check dev-tool pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only elevated permission in this repository, scoped to this one
      # job. Every other job everywhere is read-only.
      #
      # This job used to also hold `contents: write` and push the bump to a
      # branch. That could never have worked: `GITHUB_TOKEN` is a GitHub App
      # token, and GitHub refuses ANY App push that creates or updates a file
      # under `.github/workflows/` — there is no permission you can grant to
      # change that, because the `permissions:` block has no `workflows` key
      # at all. `ruff` and `mypy` are pinned in `ci.yml`, so every bump of
      # either is by definition a workflow-file edit. The push was rejected
      # on its first real attempt (run 32698539123, 2026-08-24) and took the
      # tracking issue down with it. The bump is now reported, not pushed.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every pin against its upstream latest release
        id: check
        # `--write` edits the working tree and nothing commits it. That is the
        # point: the diff it produces is the report. One invocation and one
        # round of upstream requests yields both the table and the exact patch
        # a human should apply, and the tree is thrown away with the runner.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # `pipefail` is load-bearing: the script exits non-zero when a pin site
        # no longer looks the way it declares, and without this `tee`'s exit
        # status would mask that into a green run.
        run: |
          set -euo pipefail
          python3 .github/scripts/check_pins.py --write | tee "$RUNNER_TEMP/report.md"

      - name: Open or update the tracking issue
        # `always()` because the step above exits non-zero on a refused
        # rewrite, and that is exactly when someone needs to be told. The
        # script emits `stale` BEFORE attempting any rewrite so this condition
        # is answerable even then; see the comment on `_emit` in check_pins.py.
        if: always() && steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Dev-tool pins have fallen behind"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUMPED: ${{ steps.check.outputs.bumped }}
        run: |
          set -euo pipefail
          {
            cat "$RUNNER_TEMP/report.md"
            if [ "$BUMPED" = "true" ]; then
              echo
              echo "### The bump, ready to apply"
              echo
              echo "\`check_pins.py --write\` produced this on the run above — every"
              echo "version in the table, across **all** of its sites, including both"
              echo "\`mypy==\` lines in \`ci.yml\`, which live in two different jobs:"
              echo
              echo "<details><summary>diff</summary>"
              echo
              echo '```diff'
              # Bare `git diff` is exactly the bump: the checkout above is
              # pristine, and `--write` is the only thing in this job that
              # touches the tree. Nothing else may edit files before here.
              git diff
              echo '```'
              echo
              echo "</details>"
              echo
              echo "Apply it by running the same command yourself:"
              echo
              echo '```bash'
              echo "git switch -c bump-pins main"
              echo "GITHUB_TOKEN=\$(gh auth token) python3 .github/scripts/check_pins.py --write"
              echo "pre-commit run --all-files && python3 -m unittest discover"
              echo '```'
              echo
              echo "This job does not push that itself. \`GITHUB_TOKEN\` is a GitHub App"
              echo "token, and GitHub refuses any App push touching"
              echo "\`.github/workflows/\` — which every \`ruff\` or \`mypy\` bump is, since"
              echo "both are pinned in \`ci.yml\`. No permission grants it: the"
              echo "\`permissions:\` block has no \`workflows\` key."
            fi
            echo
            echo "---"
            echo "Filed automatically by [\`pin-check\`]($RUN_URL). This issue is"
            echo "rewritten in place each run and closes itself once every pin is"
            echo "current, so it will not accumulate comments."
          } > "$RUNNER_TEMP/body.md"

          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq "[.[] | select(.title == env.TITLE)][0].number // empty")

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/body.md"
            echo "updated issue #$existing"
          else
            gh issue create --title "$TITLE" --label dependencies \
              --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Close the tracking issue once everything is current
        if: steps.check.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Dev-tool pins have fallen behind"
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq "[.[] | select(.title == env.TITLE)][0].number // empty")

          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "Every dev-tool pin now matches its upstream latest release."
            echo "closed issue #$existing"
          else
            echo "all pins current, no open issue"
          fi
