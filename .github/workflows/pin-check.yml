name: Pin check

# Dev-tool pins go stale silently. Dependabot watches GitHub Actions and
# nothing else, because there are no runtime dependencies to watch — so the
# hooks in .pre-commit-config.yaml and the tool versions in ci.yml only get
# updated when somebody happens to look. A stale security scanner reports
# clean, which is indistinguishable from a clean repo.
#
# This nags; it does not fix. It deliberately does NOT run
# `pre-commit autoupdate`: that resolves to the newest tag on each upstream's
# default branch rather than its newest release, and on this repo it proposed
# downgrading gitleaks v8.30.1 -> v8.30.0. See .github/scripts/check_pins.py.

on:
  schedule:
    # Mondays, 06:00 UTC. Weekly is enough for a drift measured in weeks.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: check dev-tool pins
    runs-on: ubuntu-latest
    permissions:
      # This job now writes, which it did not before. Both permissions are
      # scoped to it alone; every other job in this repository is read-only.
      #
      # `contents: write` is enough to push a BRANCH and nothing more. It is
      # deliberately not paired with an automated pull request: a PR opened by
      # GITHUB_TOKEN receives no check runs at all — GitHub's loop prevention —
      # and `main` requires nine of them, so such a PR would be permanently
      # unmergeable. A human opening the PR from this branch produces an
      # ordinary `pull_request` event, and CI runs normally.
      contents: write
      # Enough to file the reminder that points at that branch.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compare every pin against its upstream latest release, and bump it
        id: check
        # `--write` both reports AND edits, so one invocation and one round of
        # upstream requests covers the whole job. Locally the script still
        # defaults to read-only; writing is something a caller opts into.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_pins.py --write | tee "$RUNNER_TEMP/report.md"

      - name: Push the bumped pins to a branch
        if: steps.check.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: pins/auto
        # One machine-owned branch, rebuilt from `main` on every run rather
        # than accumulating one per week. If last week's went unmerged it is
        # simply replaced by a fresher one, which is what you would want to
        # look at anyway. Force-pushing is safe precisely because nothing but
        # this job is supposed to write here.
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit --all --message 'Bump dev-tool pins to their latest releases'
          # The checkout above sets persist-credentials: false, so the token is
          # supplied for this one push and never lands in .git/config where a
          # later step could read it back.
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${BRANCH}"

      - name: Open or update the tracking issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Dev-tool pins have fallen behind"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUMPED: ${{ steps.check.outputs.bumped }}
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/main...pins/auto?expand=1
        run: |
          set -euo pipefail
          {
            cat "$RUNNER_TEMP/report.md"
            if [ "$BUMPED" = "true" ]; then
              echo
              echo "### Already done for you"
              echo
              echo "Every version above is already bumped on \`pins/auto\`, across"
              echo "**all** of its sites — including both \`mypy==\` lines in"
              echo "\`ci.yml\`, which live in two different jobs."
              echo
              echo "**[Open the pull request]($COMPARE_URL)** — review, and merge if CI is green."
              echo
              echo "The branch is pushed rather than the PR opened, deliberately: a PR"
              echo "created by \`GITHUB_TOKEN\` gets no check runs, and \`main\` requires"
              echo "nine. Opening it yourself is what makes CI run at all."
            fi
            echo
            echo "---"
            echo "Filed automatically by [\`pin-check\`]($RUN_URL). This issue is"
            echo "rewritten in place each run and closes itself once every pin is"
            echo "current, so it will not accumulate comments."
          } > "$RUNNER_TEMP/body.md"

          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq "[.[] | select(.title == env.TITLE)][0].number // empty")

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/body.md"
            echo "updated issue #$existing"
          else
            gh issue create --title "$TITLE" --label dependencies \
              --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Close the tracking issue once everything is current
        if: steps.check.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Dev-tool pins have fallen behind"
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq "[.[] | select(.title == env.TITLE)][0].number // empty")

          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "Every dev-tool pin now matches its upstream latest release."
            echo "closed issue #$existing"
          else
            echo "all pins current, no open issue"
          fi
