name: CI

on:
  push:
    branches: [main]
    # Tags are load-bearing here: the documented install path pins one
    # (`uvx --from git+https://…@vX.Y.Z`), so the tagged ref is what users
    # actually fetch. Branch protection already means a tag can only point at
    # a commit CI validated on main — this runs the suite against the tag
    # itself, including the packaging job that builds and drives a real wheel.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. No job here needs write access to anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        # No install step. That is the product.
        run: python -m unittest discover -v

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned tools
        run: pip install ruff==0.16.1 mypy==2.3.0
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict perplexity_agent_mcp.py

  pre-commit:
    name: pre-commit (secrets, Actions security, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Cache pre-commit environments
        # zizmor's cache-poisoning audit fires here as soon as this workflow
        # triggers on tags, because a poisoned cache entry feeding a release
        # build could taint a published artifact. Suppressed deliberately, on
        # three grounds — re-check all three before assuming this still holds:
        #
        #   1. Skipped on tags outright (the `if:` below), so a release run
        #      never reads this cache. zizmor is static and cannot see that.
        #   2. Fork PRs cannot write to this repo's Actions cache, so the
        #      entry is not reachable by an outside attacker.
        #   3. Writing it therefore requires push access — and anyone with
        #      push access can change the workflow directly, so poisoning the
        #      cache buys them nothing they do not already have.
        #
        # Cost of removing it instead: measured 70s cold vs 5s warm, on every
        # PR, to defend against an attacker who by definition already won.
        # Note this job holds no secrets and runs `contents: read`.
        # zizmor: ignore[cache-poisoning]
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit==4.6.1
      - name: Run every hook that isn't already covered by another job
        # This is the point of the job: 14 of the 18 hooks in
        # .pre-commit-config.yaml (gitleaks, zizmor, actionlint, codespell,
        # and the file-hygiene checks) previously ran ONLY on machines that
        # had `pre-commit install`, so were fully bypassable via
        # --no-verify or an edit through the GitHub web UI. Running the
        # suite here closes that gap. ruff-check/ruff-format/mypy are
        # skipped because the `lint` job above already runs them against
        # the same pinned versions (tests/test_tooling_parity.py enforces
        # that); unittest is skipped because the `test` matrix already runs
        # it across all five supported Pythons, not just this job's one.
        # Skipping both avoids running identical checks twice for no reason.
        run: |
          SKIP=ruff-check,ruff-format,mypy,unittest \
            pre-commit run --all-files --show-diff-on-failure

  llm-adapter:
    name: llm adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install both distributions
        # tests/test_llm_plugin.py skips itself when `llm` is absent, which is
        # correct for MCP-only users but means the `test` matrix above never
        # actually runs those tests. Without this job they would skip in CI
        # forever and look green while proving nothing.
        #
        # Editable, and the server first: the adapter pins it exactly, so a
        # non-editable install would fetch the released version from PyPI
        # instead of testing the tree in front of us.
        run: |
          pip install -e .
          pip install -e ./llm-plugin --no-deps
          pip install 'llm>=0.27' mypy==2.3.0
      - name: Prove the adapter tests actually ran
        # A skipped test is not a passing test. Fail loudly if the extra did
        # not take, rather than reporting success on 17 skips.
        run: |
          python -m unittest tests.test_llm_plugin -v 2>&1 | tee /tmp/llm-tests.txt
          grep -qE '^OK$' /tmp/llm-tests.txt
          if grep -q 'skipped' /tmp/llm-tests.txt; then
            echo "::error::adapter tests skipped - llm or the adapter did not install"
            exit 1
          fi
      - name: Type-check the adapter against the real llm package
        # The whole-tree run cannot check this file meaningfully without llm
        # installed; this is where that check actually happens.
        run: mypy --strict llm-plugin/perplexity_agent_llm.py
      - name: Register the model in a real llm install
        # The distribution llm reports is the ADAPTER's name, not the server's
        # — they are two packages now.
        run: |
          llm plugins | tee /tmp/plugins.json
          grep -q 'llm-perplexity-agent' /tmp/plugins.json
          llm models | grep -q 'perplexity-agent'

  package:
    name: package and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          # This job builds the artifact users install, so it gets a clean room:
          # nothing from a shared cache can reach the wheel. Costs almost
          # nothing here — there are zero runtime dependencies, so the only
          # download is the setuptools build backend.
          enable-cache: false
      - name: Build the wheel
        run: uv build
      - name: Install it into a clean environment and drive the console script
        # A successful build does not prove the entry point works.
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | /tmp/smoke/bin/perplexity-agent-mcp > /tmp/smoke-out.txt
          cat /tmp/smoke-out.txt
          grep -q '"perplexity_agent"' /tmp/smoke-out.txt
          grep -q '"perplexity_agent_result"' /tmp/smoke-out.txt
          grep -q '"perplexity_agent_cancel"' /tmp/smoke-out.txt
      - name: Drive the same script over the modern protocol revision
        # The wheel has to serve BOTH eras, and the legacy leg above cannot
        # tell us anything about the modern one. server/discover is sent
        # without _meta on purpose: that is the backward-compatibility probe,
        # and answering it is the single behaviour a dual-era client depends on.
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"server/discover"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | /tmp/smoke/bin/perplexity-agent-mcp > /tmp/smoke-modern.txt
          cat /tmp/smoke-modern.txt
          grep -q '"supportedVersions"' /tmp/smoke-modern.txt
          grep -q '"2026-07-28"' /tmp/smoke-modern.txt
          # Whitespace-tolerant: _write uses json.dumps' default separators,
          # so this is '"resultType": "complete"' today. Matching the exact
          # byte sequence would make a harmless formatting change look like a
          # protocol regression.
          grep -qE '"resultType": ?"complete"' /tmp/smoke-modern.txt
          grep -q '"perplexity_agent"' /tmp/smoke-modern.txt
