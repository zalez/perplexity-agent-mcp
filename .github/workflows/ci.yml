name: CI

on:
  push:
    branches: [main]
    # Tags are load-bearing here: the documented install path pins one
    # (`uvx --from git+https://…@vX.Y.Z`), so the tagged ref is what users
    # actually fetch. Branch protection already means a tag can only point at
    # a commit CI validated on main — this runs the suite against the tag
    # itself, including the packaging job that builds and drives a real wheel.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. No job here needs write access to anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        # No install step. That is the product.
        run: python -m unittest discover -v

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - name: Install pinned tools
        run: pip install ruff==0.16.0 mypy==2.3.0
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict perplexity_agent_mcp.py

  pre-commit:
    name: pre-commit (secrets, Actions security, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - name: Cache pre-commit environments
        # zizmor's cache-poisoning audit fires here as soon as this workflow
        # triggers on tags, because a poisoned cache entry feeding a release
        # build could taint a published artifact. Suppressed deliberately, on
        # three grounds — re-check all three before assuming this still holds:
        #
        #   1. Skipped on tags outright (the `if:` below), so a release run
        #      never reads this cache. zizmor is static and cannot see that.
        #   2. Fork PRs cannot write to this repo's Actions cache, so the
        #      entry is not reachable by an outside attacker.
        #   3. Writing it therefore requires push access — and anyone with
        #      push access can change the workflow directly, so poisoning the
        #      cache buys them nothing they do not already have.
        #
        # Cost of removing it instead: measured 70s cold vs 5s warm, on every
        # PR, to defend against an attacker who by definition already won.
        # Note this job holds no secrets and runs `contents: read`.
        # zizmor: ignore[cache-poisoning]
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit==4.6.1
      - name: Run every hook that isn't already covered by another job
        # This is the point of the job: 14 of the 18 hooks in
        # .pre-commit-config.yaml (gitleaks, zizmor, actionlint, codespell,
        # and the file-hygiene checks) previously ran ONLY on machines that
        # had `pre-commit install`, so were fully bypassable via
        # --no-verify or an edit through the GitHub web UI. Running the
        # suite here closes that gap. ruff-check/ruff-format/mypy are
        # skipped because the `lint` job above already runs them against
        # the same pinned versions (tests/test_tooling_parity.py enforces
        # that); unittest is skipped because the `test` matrix already runs
        # it across all five supported Pythons, not just this job's one.
        # Skipping both avoids running identical checks twice for no reason.
        run: |
          SKIP=ruff-check,ruff-format,mypy,unittest \
            pre-commit run --all-files --show-diff-on-failure

  package:
    name: package and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          # This job builds the artifact users install, so it gets a clean room:
          # nothing from a shared cache can reach the wheel. Costs almost
          # nothing here — there are zero runtime dependencies, so the only
          # download is the flit_core build backend.
          enable-cache: false
      - name: Build the wheel
        run: uv build
      - name: Install it into a clean environment and drive the console script
        # A successful build does not prove the entry point works.
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | /tmp/smoke/bin/perplexity-agent-mcp > /tmp/smoke-out.txt
          cat /tmp/smoke-out.txt
          grep -q '"perplexity_agent"' /tmp/smoke-out.txt
          grep -q '"perplexity_agent_result"' /tmp/smoke-out.txt
          grep -q '"perplexity_agent_cancel"' /tmp/smoke-out.txt
